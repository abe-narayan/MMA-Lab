name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test

  determinism:
    name: Simulation reproduces the golden corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A bout is a pure function of its config and seed. The committed fixture
      # (tests/fixtures/sim-golden.json, ~40 bouts across every ruleset, mode,
      # arena and extreme build) stores the digest, tick and RNG-draw counts and
      # hashes of the result, events, stats and every recorded frame. Re-running
      # them must reproduce every bit; if not, the sim changed without
      # SIM_ENGINE_VERSION being bumped and the fixture regenerated, or it is
      # not deterministic.
      - name: Golden corpus reproduces bit for bit
        run: npx vitest run tests/sim.golden.test.ts
      # The same corpus through the CLI, which also asserts per bout that the
      # recorded run (frames + snapshots) and the unrecorded hot path (what
      # batches use) end on the identical digest.
      - name: Recorded and unrecorded runs agree
        run: npm run golden:check

  build:
    name: Build (and the lite standalone page)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Lite standalone page: scripts and CSS inlined, markup audited for
      # external references. The 3D view's /assets/* and the Web Worker chunks
      # stay outside it (see scripts/inline.mjs): opened from disk it runs the
      # creator, simulator, batch (main thread) and 2D view.
      - name: Inline into a single lite page
        run: node scripts/inline.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: bout-lab-standalone
          path: dist/standalone.html
          if-no-files-found: error
