name: Bug report
description: Something in the simulation, the viewer or the app behaves incorrectly.
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this.

        **Every bout is reproducible from its replay file** (the download button on the Watch
        screen saves a `.boutreplay` file: the seed plus the full setup). With it anyone can
        re-simulate the identical bout and step through it tick by tick, so please attach it
        even if the problem looks obvious from a screenshot.

        If you want to argue that a modelling assumption is wrong rather than report a defect,
        please use the "Modelling question" template instead. A win rate you disagree with is
        usually an assumption, not a bug.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe, and what did you expect instead?
      placeholder: |
        A fighter was drawn on top with nobody underneath from about 0:42 of round 2.
        Expected: the grappling invariant guarantees a partner.
    validations:
      required: true

  - type: textarea
    id: replay
    attributes:
      label: Replay file and seed
      description: >-
        Attach the `.boutreplay` file (drag it into this box; zip it if GitHub refuses the
        extension), and the bout's seed if you have it. The seed alone is
        not enough: the fighters, mode, ruleset and match settings are part of the bout.
      placeholder: "seed: 7f3a91c2 (file attached)"
    validations:
      required: true

  - type: input
    id: engine-version
    attributes:
      label: Engine version
      description: The engine version the bout was recorded with (SIM_ENGINE_VERSION in src/sim/record/recorder.ts, stored in every replay file).
      placeholder: "5.0.0"
    validations:
      required: false

  - type: input
    id: tick
    attributes:
      label: Tick or round time
      description: If the problem happens at a particular moment, when?
      placeholder: "tick 1187, or round 2 at 0:42"
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Where does it occur
      options:
        - Simulation result (src/sim)
        - Determinism or verification (digest mismatch, replay not verified)
        - Grappling or engagement invariant
        - 3D broadcast view
        - 2D view, replay transport or HUD
        - Fighter creator, database or tournaments
        - Batch screen / analytics
        - Build, scripts or the standalone page
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: >-
        The commands or the clicks. Output from the scripts is very helpful - for example
        `npm run golden:check` (re-runs the committed golden corpus bit for bit) or a failing
        test.
      render: shell

  - type: textarea
    id: checks
    attributes:
      label: Output of the checks
      description: >-
        If you can, paste the relevant output of npm test or npm run golden:check.
        Redact nothing; none of it contains anything personal.
      render: shell

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node version, OS, browser, and whether you were running the dev server, the preview build or dist/standalone.html.
      placeholder: "Node 22.9.0, macOS 15, Firefox 131, dist/standalone.html from file://"
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I have attached the replay file (or given the full setup and seed), so this bout can be reproduced exactly.
          required: true
        - label: This is a defect in the implementation, not a disagreement with a modelling assumption.
          required: true
        - label: I have read the disclaimer in the README and I am not reporting that the model disagrees with a real-world outcome.
          required: true
