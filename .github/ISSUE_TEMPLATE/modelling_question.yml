name: Modelling question
description: Challenge a parameter in the src/sim/params registry, or the reasoning behind one.
title: "[model] "
labels:
  - modelling
body:
  - type: markdown
    attributes:
      value: |
        This is the most useful kind of issue this project can receive.

        Every probability, coefficient and threshold in Bout Lab is a modelling assumption.
        They all live in one registry, `src/sim/params/` (one `*.params.ts` file per design
        chapter), each with its unit and a provenance tag saying whether it is sourced
        (`[S: ...]`), derived (`[D: ...]`) or simply estimated (`[E]`), precisely so that they
        can be argued with one at a time.

        "This looks implausible on screen" is a legitimate argument here, and is honestly how
        most of the current values were arrived at. Just say so plainly rather than presenting
        it as data.

        Please do not use this template to ask the project to predict a real matchup, to model
        a named person, or to be validated against real fight records.

  - type: input
    id: parameter
    attributes:
      label: Which parameter
      description: >-
        The parameter id in src/sim/params/ (for example `p.strike.geom.jabReachAdd`), or the
        derivation constant in src/sim/fighter/. One per issue where possible.
      placeholder: "p.strike.geom.jabReachAdd"
    validations:
      required: true

  - type: input
    id: current-value
    attributes:
      label: Its current value
      placeholder: "0.27 m"
    validations:
      required: true

  - type: input
    id: proposed-value
    attributes:
      label: What you think it should be
      description: A value or a range. "Lower, but I do not know by how much" is an acceptable answer - say that.
      placeholder: "0.22 m, or 0.18 to 0.25 m"
    validations:
      required: true

  - type: textarea
    id: reasoning
    attributes:
      label: Evidence or reasoning
      description: >-
        What supports the change? Published data, a documented rule set, physical reasoning,
        domain experience, or an argument that the current value produces behaviour that does
        not read plausibly. Cite what you can, and be explicit about which of those this is.
      placeholder: |
        The value I am arguing against is a per-strike placement lottery available to both
        sides on identical terms. My argument is that ... and the basis for it is ...
    validations:
      required: true

  - type: dropdown
    id: basis
    attributes:
      label: What kind of argument is this
      description: Be honest here; it does not weaken your case, it just tells a reader how to read it.
      options:
        - Published data or a cited source
        - A documented rule set or regulation
        - Physical or mathematical reasoning
        - Domain experience / coaching or competing background
        - It does not look plausible on screen
        - Internal inconsistency with another parameter in the same file
        - Other
    validations:
      required: true

  - type: textarea
    id: expected-effect
    attributes:
      label: What you expect it to change
      description: >-
        Which outputs should move, and roughly how far. If you have run it, paste the before
        and after numbers from a calibration batch with the parameter overridden
        (`npm run batch -- --plan ufc_population --n 200 --params overrides.json --out runs/x`,
        then `npm run calibrate:report -- runs/x --baseline <reference run>`; see
        docs/CALIBRATION.md). The current reference numbers are in docs/CALIBRATION.md.
      render: shell

  - type: textarea
    id: knock-ons
    attributes:
      label: Knock-on effects you can see
      description: >-
        Parameters in this model are not independent, and the multi-opponent results in
        particular are dominated by behavioural assumptions rather than physical ones. What
        else would this move?
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I have named a specific parameter and a specific value I think it should take.
          required: true
        - label: I have stated what kind of argument this is, and have not presented a judgement call as a measurement.
          required: true
        - label: I understand this is a modelling toy and I am not asking it to predict a real outcome.
          required: true
