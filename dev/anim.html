<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animation browser</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0d11; color: #ddd; font: 12px/1.4 system-ui, sans-serif; overflow: hidden; }
    #view { position: absolute; inset: 0; }
    #panel { position: absolute; top: 8px; left: 8px; background: rgba(10, 12, 16, 0.86); border: 1px solid #2a2f38;
      border-radius: 6px; padding: 8px 10px; width: 250px; max-height: calc(100% - 16px); overflow: auto; z-index: 2; }
    #panel.hidden { display: none; }
    #panel h1 { font-size: 13px; margin: 0 0 6px; }
    #panel label { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin: 3px 0; }
    #panel select, #panel input, #panel button { font: inherit; background: #1b1f27; color: #ddd; border: 1px solid #333a46; border-radius: 3px; padding: 2px 4px; }
    #panel select { max-width: 150px; }
    #panel button { margin: 4px 4px 0 0; }
    #scrub { width: 100%; }
    #info { font: 11px/1.35 ui-monospace, monospace; white-space: pre; margin-top: 6px; color: #9fb3c8; }
    .lab { position: absolute; font: 600 13px/1.2 system-ui, sans-serif; color: #e8e8e8; text-shadow: 0 1px 2px #000;
      pointer-events: none; white-space: pre; z-index: 1; }
    .lab.small { font-weight: 400; font-size: 11px; color: #b8c4d0; }
  </style>
</head>
<body>
  <div id="view"></div>
  <div id="labels"></div>
  <div id="panel">
    <h1>Animation browser</h1>
    <label>Mode <select id="mode">
      <option value="tech">technique</option><option value="strip">key-frame strip</option>
      <option value="tiers">T0 vs T5</option><option value="bout">real bout</option>
      <option value="footwork">footwork</option><option value="kd">knockdown</option>
    </select></label>
    <label>Technique <select id="tech"></select></label>
    <label>Result <select id="result"><option>landed</option><option>blocked</option><option>evaded</option><option>missed</option><option>checked</option><option>caught</option></select></label>
    <label>Defence <select id="defence"></select></label>
    <label>Tier A <select id="tierA"><option value="">own</option><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label>
    <label>Tier B <select id="tierB"><option value="">own</option><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label>
    <label>Stance A <select id="stance"><option>orthodox</option><option>southpaw</option></select></label>
    <label>Distance <input id="dist" type="number" step="0.05" value="1.3" style="width:60px"></label>
    <label>Speed <select id="speed"><option>0.1</option><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option></select></label>
    <label>Motion capture <input id="capChk" type="checkbox" checked></label>
    <label>View <select id="viewSel"><option>side</option><option>front</option><option>iso</option><option>back</option><option>top</option></select></label>
    <input id="scrub" type="range" min="0" max="1000" value="0">
    <div>
      <button id="play" type="button">Pause</button>
      <button id="stepB" type="button">&lt; frame</button>
      <button id="stepF" type="button">frame &gt;</button>
      <button id="apply" type="button">Apply</button>
    </div>
    <div id="info"></div>
  </div>
  <script type="module" src="./anim.ts"></script>
</body>
</html>
