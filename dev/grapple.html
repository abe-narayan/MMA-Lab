<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grapple pose browser</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0d11; color: #ddd; font: 12px/1.4 system-ui, sans-serif; overflow: hidden; }
    #view { position: absolute; inset: 0; }
    #panel { position: absolute; top: 8px; left: 8px; background: rgba(10, 12, 16, 0.86); border: 1px solid #2a2f38;
      border-radius: 6px; padding: 8px 10px; width: 290px; max-height: calc(100% - 16px); overflow: auto; }
    #panel.hidden { display: none; }
    #panel h1 { font-size: 13px; margin: 0 0 6px; }
    #panel label { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
    #panel select, #panel button, #panel input[type=text] { font: inherit; background: #1b1f27; color: #ddd; border: 1px solid #333a46; border-radius: 3px; padding: 2px 4px; max-width: 200px; }
    #panel input[type=range] { flex: 1; }
    #info { font: 11px/1.35 ui-monospace, monospace; white-space: pre-wrap; margin-top: 6px; color: #9fb3c8; }
    .cell-label { position: absolute; font: 600 13px/1.2 system-ui, sans-serif; color: #f0f0f0; background: rgba(0,0,0,0.55);
      padding: 3px 7px; border-radius: 3px; pointer-events: none; }
    #title { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); font: 600 18px system-ui; color: #fff;
      background: rgba(0,0,0,0.5); padding: 4px 12px; border-radius: 4px; pointer-events: none; }
  </style>
</head>
<body>
  <div id="view"></div>
  <div id="panel">
    <h1>Grapple pose browser</h1>
    <label>Node <select id="node"></select></label>
    <label>Edge <select id="edge"><option value="">—</option></select></label>
    <label>Phase <input id="phase" type="range" min="0" max="1" step="0.01" value="0"><button id="play" type="button">▶</button></label>
    <label>Sub <select id="sub"><option value="">—</option></select></label>
    <label>Stage <select id="stage"><option>1</option><option>2</option><option selected>3</option><option>4</option></select>
      <label><input id="limp" type="checkbox"> LOC</label></label>
    <label>Strike <select id="strike"><option value="">—</option><option>tech.gnp_punch</option><option>tech.gnp_elbow</option><option>tech.gnp_hammerfist</option><option>tech.bottom_punch</option></select></label>
    <label>Sizes <select id="sizes"><option value="1.93,1.65">heavy (a) / fly (b)</option><option value="1.65,1.93">fly (a) / heavy (b)</option><option value="1.78,1.78">equal</option></select></label>
    <label><input id="mirror" type="checkbox"> mirror</label>
    <label><input id="postured" type="checkbox"> postured</label>
    <label>Camera <select id="cam"><option>iso</option><option>side</option><option>front</option><option>back</option><option>top</option><option>low</option><option>iso2</option></select></label>
    <div id="info"></div>
  </div>
  <div id="title"></div>
  <script type="module" src="./grapple.ts"></script>
</body>
</html>
