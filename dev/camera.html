<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camera director and broadcast graphics</title>
  <style>
    html, body { margin: 0; height: 100%; background: #030405; color: #cfd6e2; font: 12px/1.4 system-ui, sans-serif; overflow: hidden; }
    #stage { position: absolute; left: 50%; top: 0; transform: translateX(-50%); background: #000; overflow: hidden; }
    #stage canvas { display: block; width: 100%; height: 100%; outline: none; }
    #dev { position: absolute; left: 0; right: 0; bottom: 0; background: #0b0d12; border-top: 1px solid #1f2430; }
    #dev.hidden { display: none; }
    #timeline { display: block; width: 100%; height: 86px; cursor: pointer; }
    #bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 6px 10px 8px; }
    #bar button, #bar select { font: inherit; background: #171b24; color: #d6dce6; border: 1px solid #2c3342; border-radius: 3px; padding: 2px 8px; }
    #bar button[aria-pressed="true"] { background: #e9b44c; color: #111; border-color: #e9b44c; }
    #bar .grp { display: flex; gap: 4px; align-items: center; }
    #bar .lbl { color: #7c8699; margin-right: 2px; }
    #readout { font: 12px/1.3 ui-monospace, Consolas, monospace; color: #9fb3c8; white-space: pre; margin-left: auto; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="dev">
    <canvas id="timeline"></canvas>
    <div id="bar">
      <div class="grp"><button id="play" type="button">Play</button><button id="back" type="button">-5s</button><button id="fwd" type="button">+5s</button></div>
      <div class="grp"><span class="lbl">Speed</span><span id="speeds"></span></div>
      <div class="grp"><span class="lbl">Camera</span><span id="modes"></span></div>
      <div class="grp"><span class="lbl">Lock</span><select id="lock"></select></div>
      <div class="grp"><span class="lbl">Replays</span><span id="replays"></span></div>
      <div class="grp"><label><input id="shotlabel" type="checkbox"> shot label</label></div>
      <div id="readout"></div>
    </div>
  </div>
  <script type="module" src="./camera.ts"></script>
</body>
</html>
